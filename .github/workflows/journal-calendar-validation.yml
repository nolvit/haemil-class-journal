name: Journal calendar validation
on:
  push:
    branches:
      - release/journal-four-week-calendar-20260918
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install package manager
        run: npm install --global pnpm@10.15.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        id: types
        continue-on-error: true
        run: pnpm check
      - name: Unit tests
        id: tests
        continue-on-error: true
        run: pnpm test
      - name: Production build
        id: build
        continue-on-error: true
        run: pnpm build
      - name: Verify all checks
        env:
          TYPES: ${{ steps.types.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: test "$TYPES" = success && test "$TESTS" = success && test "$BUILD" = success
